/* ================================================================
   DA « Circuit » pour illenium-appearance
   Panneau collé à droite, angles vifs, typographie condensée, rouge.
   Pour revenir à l'original : supprimer ce bloc <style> et remettre
   currentTheme = "qb-core" dans shared/theme.lua.
   ================================================================ */

:root {
  --u: calc(100vh / 1080);            /* 1 pixel à 1080p, s'adapte à la résolution */

  --accent: #EF4444;                  /* rouge vif : textes, curseurs, survols */
  --accent-soft: rgba(239, 68, 68, 0.16);
  --accent-fill: #DC2626;             /* rouge des boutons pleins */
  --accent-fill-hover: #E53935;
  --accent-ink: #FFFFFF;

  --ink: #F0F0F2;
  --muted: #A1A1AA;
  --panel: rgba(12, 12, 14, 0.94);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);

  --pad: calc(36 * var(--u));
  --panel-w: calc(500 * var(--u));
  --panel-x: calc(100vw - var(--panel-w));
  --head: calc(150 * var(--u));
  --foot: calc(56 * var(--u));

  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}

/* ---------- Structure : le panneau collé à droite ---------- */

.sc-dhKdcB {
  position: relative !important;
}

.sc-dhKdcB::before {
  content: "";
  position: absolute;
  left: var(--panel-x);
  top: 0;
  width: var(--panel-w);
  height: 100vh;
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: inset 0 calc(4 * var(--u)) 0 var(--accent);
  pointer-events: none;
  z-index: 0;
}

.sc-dhKdcB::after {
  content: "Apparence";
  position: absolute;
  left: calc(var(--panel-x) + var(--pad));
  top: calc(var(--pad) + 34 * var(--u));
  font-family: var(--display);
  font-size: calc(72 * var(--u));
  font-weight: 700;
  line-height: 0.9;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  color: var(--ink);
  pointer-events: none;
  z-index: 1;
}

.sc-kpDqfm {
  position: relative !important;
  z-index: 1;
  width: var(--panel-w) !important;
  max-width: none !important;
  height: calc(100vh - 2 * var(--pad) - var(--head) - var(--foot) - 24 * var(--u)) !important;
  margin: calc(var(--pad) + var(--head)) 0 0 auto !important;
  padding: calc(4 * var(--u)) var(--pad) calc(16 * var(--u)) !important;
  background: none !important;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 calc(10 * var(--u)), #000 calc(100% - 24 * var(--u)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 calc(10 * var(--u)), #000 calc(100% - 24 * var(--u)), transparent 100%);
}

/* ---------- Sections ---------- */

.sc-aXZVg {
  color: var(--ink) !important;
}

.sc-aXZVg + div {
  margin-top: calc(6 * var(--u)) !important;
}

.sc-gEvEer {
  height: calc(52 * var(--u)) !important;
  padding: 0 calc(18 * var(--u)) !important;
  border: 1px solid var(--line);
  box-shadow: none !important;
  transform: none !important;
}

.sc-gEvEer span {
  font-family: var(--display);
  font-size: calc(19 * var(--u)) !important;
  font-weight: 600 !important;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sc-gEvEer svg {
  width: calc(18 * var(--u));
  height: calc(18 * var(--u));
}

.sc-eqUAAy {
  padding: 0 0 calc(8 * var(--u)) !important;
}

/* Éléments : une liste séparée par des filets, sans cartes */
.sc-fqkvVR {
  margin-top: 0 !important;
  padding: calc(18 * var(--u)) calc(4 * var(--u)) !important;
  border-radius: 0 !important;
  background: none !important;
  border-bottom: 1px solid var(--line);
}

.sc-fqkvVR > span {
  font-family: var(--display);
  font-size: calc(17 * var(--u)) !important;
  font-weight: 600 !important;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink) !important;
}

.sc-dcJsrY {
  margin-top: calc(12 * var(--u)) !important;
}

.sc-dcJsrY > div + div {
  margin-top: calc(12 * var(--u)) !important;
}

.sc-dAlyuH > div + div {
  margin-left: calc(12 * var(--u)) !important;
}

.sc-gsFSXq > span small,
.sc-kAyceB > span small,
.sc-iGgWBj > span small,
.sc-imWYAI > span small,
.sc-ikkxIA > span small {
  font-size: calc(11 * var(--u)) !important;
  font-weight: 600 !important;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted) !important;
}

.sc-gsFSXq > span small + small,
.sc-kAyceB > span small + small {
  color: var(--accent) !important;
  font-variant-numeric: tabular-nums;
}

/* ---------- Sélecteurs ‹ 24 › ---------- */

.sc-gsFSXq > div {
  height: calc(44 * var(--u)) !important;
  margin-top: calc(6 * var(--u)) !important;
  border: 1px solid var(--line-2);
  border-radius: calc(3 * var(--u));
  background: rgba(255, 255, 255, 0.03);
  overflow: hidden;
}

.sc-gsFSXq > div button {
  min-width: calc(44 * var(--u)) !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--ink) !important;
  transform: none !important;
}

.sc-gsFSXq > div button:hover {
  background: var(--accent-soft) !important;
  color: var(--accent) !important;
}

.sc-gsFSXq > div button svg {
  width: calc(16 * var(--u));
  height: calc(16 * var(--u));
}

.sc-gsFSXq > div input {
  margin: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--ink) !important;
  font-family: var(--display);
  font-size: calc(22 * var(--u)) !important;
  font-weight: 700 !important;
  font-variant-numeric: tabular-nums;
}

/* ---------- Curseurs : barre fine, repère vertical ---------- */

.sc-kAyceB > div {
  margin-top: calc(12 * var(--u)) !important;
}

.sc-kAyceB > div > small {
  font-size: calc(11 * var(--u)) !important;
  color: var(--muted);
}

.sc-kAyceB input[type="range"] {
  height: calc(2 * var(--u)) !important;
  margin: 0 calc(12 * var(--u)) !important;
  border-radius: 0 !important;
  background: var(--line-2) !important;
}

.sc-kAyceB input[type="range"]::-webkit-slider-thumb {
  width: calc(8 * var(--u)) !important;
  height: calc(24 * var(--u)) !important;
  border-radius: calc(2 * var(--u)) !important;
  background: var(--accent) !important;
}

/* ---------- Pastilles de couleur ---------- */

.sc-jXbUNg {
  width: calc(22 * var(--u)) !important;
  height: calc(22 * var(--u)) !important;
  margin: calc(2 * var(--u)) !important;
  border-radius: calc(2 * var(--u)) !important;
}

/* ---------- Listes déroulantes ---------- */

.sc-aXZVg [class*="__control"] {
  min-height: calc(44 * var(--u)) !important;
  border: 1px solid var(--line-2) !important;
  border-radius: calc(3 * var(--u)) !important;
  background: rgba(255, 255, 255, 0.03) !important;
  box-shadow: none !important;
}

.sc-aXZVg [class*="__control--is-focused"] {
  border-color: var(--accent) !important;
}

.sc-aXZVg [class*="__single-value"],
.sc-aXZVg [class*="__input"] input,
.sc-aXZVg [class*="__placeholder"] {
  color: var(--ink) !important;
  font-size: calc(14 * var(--u)) !important;
}

.sc-aXZVg [class*="__indicator-separator"] {
  display: none !important;
}

.sc-aXZVg [class*="__indicator"] {
  color: var(--muted) !important;
}

.sc-aXZVg [class*="__menu"] {
  border-radius: calc(3 * var(--u)) !important;
  background: #16161A !important;
  border: 1px solid var(--line-2) !important;
  box-shadow: none !important;
  overflow: hidden;
}

.sc-aXZVg [class*="__option"] {
  color: var(--ink) !important;
  background: transparent !important;
  font-size: calc(14 * var(--u)) !important;
}

.sc-aXZVg [class*="__option--is-focused"] {
  background: var(--accent-soft) !important;
}

.sc-aXZVg [class*="__option--is-selected"] {
  background: var(--accent-fill) !important;
  color: var(--accent-ink) !important;
}

.sc-gFqAkR {
  padding: calc(10 * var(--u)) calc(18 * var(--u)) !important;
  border: 1px solid var(--line-2);
  border-radius: calc(3 * var(--u)) !important;
  background-color: transparent !important;
  color: var(--ink) !important;
  font-family: var(--display);
  font-weight: 600 !important;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sc-gFqAkR:hover {
  border-color: var(--accent-fill);
  background-color: var(--accent-fill) !important;
  color: var(--accent-ink) !important;
}

/* ---------- Colonne d'outils en haut à gauche (caméra, rotation) ---------- */

.sc-jlZhew {
  position: fixed !important;
  left: calc(40 * var(--u)) !important;
  top: calc(40 * var(--u)) !important;
  bottom: auto !important;
  right: auto !important;
  width: auto !important;
  height: max-content !important;
  margin: 0 !important;
  padding: calc(8 * var(--u)) !important;
  flex-direction: column !important;
  align-items: center !important;
  gap: calc(8 * var(--u));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: calc(4 * var(--u));
  z-index: 5;
}

.sc-jlZhew > * + * {
  margin-top: 0 !important;
}

.sc-jlZhew::before {
  content: "Création du personnage";
  position: fixed;
  left: calc(var(--panel-x) + var(--pad));
  top: calc(var(--pad) + 4 * var(--u));
  font-size: calc(13 * var(--u));
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  pointer-events: none;
}

.sc-jlZhew button,
.sc-dLMFU {
  width: calc(48 * var(--u)) !important;
  height: calc(48 * var(--u)) !important;
  border: 1px solid var(--line) !important;
  border-radius: calc(3 * var(--u)) !important;
  background: transparent !important;
  color: var(--ink) !important;
  box-shadow: none !important;
  transform: none !important;
}

.sc-jlZhew button:hover,
.sc-cPiKLX:hover .sc-dLMFU {
  border-color: var(--accent) !important;
  background: var(--accent-soft) !important;
  color: var(--accent) !important;
}

.sc-jlZhew button svg,
.sc-dLMFU svg {
  width: calc(18 * var(--u));
  height: calc(18 * var(--u));
}

/* Groupes caméra / vêtements : les options s'ouvrent à droite au survol */
.sc-cPiKLX {
  position: relative;
  width: calc(48 * var(--u)) !important;
  height: calc(48 * var(--u)) !important;
  overflow: visible !important;
}

.sc-cPiKLX .sc-eDPEul {
  display: none !important;
  position: absolute;
  left: 100%;
  top: 50%;
  bottom: auto;
  transform: translateY(-50%);
  padding: 0 0 0 calc(18 * var(--u)) !important;   /* pont pour garder le survol */
}

.sc-cPiKLX:hover .sc-eDPEul {
  display: flex !important;
}

.sc-eDPEul::before {
  content: "";
  position: absolute;
  top: calc(-8 * var(--u));
  bottom: calc(-8 * var(--u));
  left: calc(10 * var(--u));
  right: calc(-8 * var(--u));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: calc(4 * var(--u));
  z-index: -1;
}

.sc-eDPEul > * + * {
  margin-left: calc(8 * var(--u)) !important;
}

/* ---------- Annuler / Enregistrer en bas du panneau ---------- */

.sc-jlZhew > .sc-cwHptR + .sc-jEACwC {
  position: fixed !important;
  left: calc(var(--panel-x) + var(--pad) + (var(--panel-w) - 2 * var(--pad) - 12 * var(--u)) * 0.36 + 12 * var(--u));
  bottom: var(--pad);
  width: calc((var(--panel-w) - 2 * var(--pad) - 12 * var(--u)) * 0.64) !important;
  height: var(--foot) !important;
  gap: calc(10 * var(--u));
  border: 0 !important;
  border-radius: 0 !important;
  background: var(--accent-fill) !important;
  color: var(--accent-ink) !important;
  clip-path: polygon(0 0, 100% 0, calc(100% - 16 * var(--u)) 100%, 0 100%);
}

.sc-jlZhew > .sc-cwHptR + .sc-jEACwC:last-child {
  left: calc(var(--panel-x) + var(--pad));

}

.sc-jlZhew > .sc-cwHptR + .sc-jEACwC::after {

.sc-jlZhew > .sc-cwHptR + .sc-jEACwC:hover {

}

.sc-jlZhew > .sc-cwHptR + .sc-jEACwC + .sc-jEACwC {
  position: fixed !important;
  left: calc(var(--panel-x) + var(--pad));
  bottom: var(--pad);

.sc-jlZhew > .sc-cwHptR + .sc-jEACwC + .sc-jEACwC::after {

/* ---------- Fenêtre de confirmation ---------- */

.sc-eldPxv {

  text-shadow: none !important;
  color: var(--ink) !important;

}

.sc-eldPxv > p {
  font-family: var(--display) !important;

.sc-eldPxv > p::after {

.sc-eldPxv > span {

.sc-fPXMVe {

}

.sc-fPXMVe button {

    <style id="kirito-theme">
/* ================================================================
   Thème « Kirito » pour illenium-appearance — même style que l'inventaire.
   Le thème et la couleur viennent de server.cfg (mêmes réglages que l'inventaire) :
     setr inventory:theme  "ombre"    -> ombre | verre | liquide | neon | brut | clair
     setr inventory:accent "#4F8CFF"  -> couleur principale (vide = celle du thème)
     setr inventory:echelle "100"     -> taille en %
   La couleur choisie par le joueur dans l'inventaire est reprise ici.
   Se pose par-dessus la base « Circuit » (bloc da-circuit ci-dessus).
   ================================================================ */

html.kt {
  --echelle: 1;
  --u: calc(100vh / 1080 * var(--echelle));

  /* couleur principale (remplie par le script) */
  --k-accent: #4F8CFF;
  --k-accent-rgb: 79, 140, 255;
  --k-accent-clair: #84AEFF;
  --k-sur-accent: #FFFFFF;

  /* raccord avec la base « Circuit » */
  --accent: var(--k-accent-clair);
  --accent-soft: rgba(var(--k-accent-rgb), 0.18);
  --accent-fill: var(--k-accent);
  --accent-fill-hover: var(--k-accent);
  --accent-ink: var(--k-sur-accent);
  --ink: var(--texte);
  --muted: var(--texte-2);
  --panel: var(--app-panneau);
  --line: var(--case-bord);
  --line-2: var(--case-bord);
  --display: var(--police-titre);

  --marge: calc(14 * var(--u));
  --rayon-k: calc(var(--case-rayon) * 1.6);
}

/* ---------- Thèmes (mêmes noms et mêmes couleurs que l'inventaire) ---------- */

html.kt[data-theme="ombre"] {
  --police: 'Montserrat', 'Roboto', sans-serif;
  --police-titre: 'Montserrat', 'Roboto', sans-serif;
  --casse: uppercase;
  --texte: #F5F5F7;
  --texte-2: rgba(255, 255, 255, 0.64);
  --texte-3: rgba(255, 255, 255, 0.42);
  --case-fond: rgba(34, 34, 38, 0.62);
  --case-plein: rgba(48, 48, 54, 0.80);
  --case-bord: rgba(255, 255, 255, 0.06);
  --case-rayon: calc(9 * var(--u));
  --app-panneau: rgba(20, 20, 24, 0.80);
  --app-entete: rgba(0, 0, 0, 0.22);
  --app-bord: rgba(255, 255, 255, 0.06);
  --app-ombre: 0 calc(16 * var(--u)) calc(48 * var(--u)) rgba(0, 0, 0, 0.35);
  --menu-fond: rgba(18, 18, 21, 0.97);
  --relief: inset 0 1px 0 rgba(255, 255, 255, 0.07);
}

html.kt[data-theme="verre"] {
  --police: 'Manrope', 'Roboto', sans-serif;
  --police-titre: 'Manrope', 'Roboto', sans-serif;
  --casse: none;
  --texte: #F4F5F7;
  --texte-2: rgba(244, 245, 247, 0.66);
  --texte-3: rgba(244, 245, 247, 0.42);
  --case-fond: rgba(255, 255, 255, 0.055);
  --case-plein: rgba(255, 255, 255, 0.11);
  --case-bord: rgba(255, 255, 255, 0.08);
  --case-rayon: calc(11 * var(--u));
  --app-panneau: linear-gradient(165deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0) 65%), rgba(18, 20, 26, 0.70);
  --app-entete: rgba(255, 255, 255, 0.03);
  --app-bord: rgba(255, 255, 255, 0.12);
  --app-ombre: 0 2.4vh 6vh rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  --menu-fond: rgba(24, 26, 32, 0.97);
  --relief: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

html.kt[data-theme="liquide"] {
  --police: 'Inter', 'Manrope', 'Roboto', sans-serif;
  --police-titre: 'Inter', 'Manrope', 'Roboto', sans-serif;
  --casse: none;
  --texte: #FFFFFF;
  --texte-2: rgba(255, 255, 255, 0.78);
  --texte-3: rgba(255, 255, 255, 0.55);
  --case-fond: rgba(96, 100, 112, 0.30);
  --case-plein: rgba(118, 122, 134, 0.42);
  --case-bord: rgba(255, 255, 255, 0.16);
  --case-rayon: calc(19 * var(--u));
  --app-panneau: linear-gradient(155deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 34%, rgba(255, 255, 255, 0) 58%, rgba(255, 255, 255, 0.05) 100%), rgba(70, 74, 84, 0.42);
  --app-entete: transparent;
  --app-bord: rgba(255, 255, 255, 0.22);
  --app-ombre: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 1px 0 0 rgba(255, 255, 255, 0.2), inset 0 -1px 0 rgba(255, 255, 255, 0.14), 0 calc(16 * var(--u)) calc(48 * var(--u)) rgba(0, 0, 0, 0.28);
  --menu-fond: rgba(38, 40, 46, 0.95);
  --relief: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 1px 0 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(255, 255, 255, 0.12), 0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(0, 0, 0, 0.16);
}

html.kt[data-theme="neon"] {
  --police: 'Rajdhani', 'Roboto', sans-serif;
  --police-titre: 'Rajdhani', 'Roboto', sans-serif;

<body>
    <div id="root"></div>
    <script id="kirito-theme-script">
      // Thème « Kirito » : reçoit le thème et la couleur envoyés par client.lua (server.cfg + choix du joueur)
      (function () {
        var racine = document.documentElement;
        var THEMES = { ombre: '#4F8CFF', verre: '#7C9CFF', liquide: '#0A84FF', neon: '#22D3EE', brut: '#DC2626', clair: '#2563EB' };

        function versRgb(hex) {
          var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
          if (!m) return null;
          var n = parseInt(m[1], 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function versHex(rgb) {
          return '#' + rgb.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join('').toUpperCase();
        }

        function appliquer(d) {
          d = d || {};
          var nom = String(d.theme || '').toLowerCase().replace(/[\s_-]/g, '');
          if (nom === 'liquid' || nom === 'liquidglass' || nom === 'glass') nom = 'liquide';
          if (!THEMES[nom]) nom = 'ombre';
          racine.setAttribute('data-theme', nom);

          var rgb = versRgb(d.couleurJoueur) || versRgb(d.accent) || versRgb(THEMES[nom]);
          var clair = rgb.map(function (v) { return v + (255 - v) * 0.35; });
          var lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
          racine.style.setProperty('--k-accent', versHex(rgb));
          racine.style.setProperty('--k-accent-rgb', rgb.join(', '));
          racine.style.setProperty('--k-accent-clair', versHex(clair));
          racine.style.setProperty('--k-sur-accent', lum > 0.62 ? '#111215' : '#FFFFFF');

          var e = Math.min(1.4, Math.max(0.6, (Number(d.echelle) || 100) / 100));
          racine.style.setProperty('--echelle', String(e));
        }

        window.addEventListener('message', function (ev) {
          var m = ev.data;
          if (m && m.action === 'kiritoTheme') appliquer(m.data);
        });

        appliquer({ theme: 'ombre' });
      })();
    </script>
